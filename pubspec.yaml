name: login_register_page
description: "Login and register screens with Arabic/English support, built with Flutter and Riverpod."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.13.7
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  k7addadev_ui: ^0.1.0
  google_fonts: ^9.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.17.1
flutter:
  uses-material-design: true
  assets:
    - images/

flutter_intl:
  enabled: true
